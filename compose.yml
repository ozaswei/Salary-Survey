services:
  app:
    build: .
    ports:
      - "7070:7070"
    volumes:
      - .:/var/www/html
    command: >
      sh -c "composer install &&
             php artisan serve --host=0.0.0.0 --port=7070"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: salarysurvey
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"